# Render hosts the app; Neon supplies PostgreSQL (no Render database is created).
services:
  - type: web
    name: linkforge
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ANALYTICS_SALT
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
