services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: linkforge
      POSTGRES_USER: linkforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U linkforge]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  app:
    build: .
    ports:
      - 3000:3000
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: linkforge
      DB_NAME: linkforge
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ANALYTICS_SALT: ${ANALYTICS_SALT:?Set ANALYTICS_SALT in .env}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, "node scripts/migrate.js && node src/app.js"]
volumes:
  postgres_data:
